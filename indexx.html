<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Закиньте монету мальчику на лечение</title>
    <style>
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            padding: 80px 20px 140px;
            min-height: 250vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #222;
            background: #111;
            overflow-x: hidden;
        }
        #bg-59 {
            position: fixed;
            inset: 0;
            z-index: -1;
            animation: fadeIn 1.5s ease forwards;
        }
        #bg-59 canvas { display: block; width: 100%; height: 100%; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(35px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 6px 20px rgba(255, 126, 95, 0.4); }
            50% { box-shadow: 0 10px 30px rgba(255, 126, 95, 0.7); }
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 70px 35px 90px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 520px;
            width: 100%;
            min-height: 1500px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            box-sizing: border-box;
            animation: fadeInUp 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .photo-placeholder {
            width: 150px;
            height: 150px;
            margin: 0 auto 25px;
            background: #e0e0e0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-weight: bold;
            overflow: hidden;
            animation: floatSlow 5s ease-in-out infinite;
        }
        .photo-placeholder img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 28px; margin-bottom: 20px; color: #111; }
        p { font-size: 17px; line-height: 1.6; color: #444; margin-bottom: 25px; }

        .donate-btn {
            display: inline-block;
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            padding: 18px 45px;
            border-radius: 50px;
            cursor: pointer;
            animation: pulseGlow 3s ease-in-out infinite;
            transition: transform 0.4s ease;
            margin: 15px auto 30px;
        }
        .donate-btn:hover { transform: translateY(-4px) scale(1.04); }

        .links {
            font-size: 15px;
            color: #555;
            word-break: break-all;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            padding-top: 30px;
        }
        .links a { color: #23a6d5; text-decoration: none; font-weight: 500; transition: color 0.3s; }
        .links a:hover { color: #ff7e5f; }

        .music-player {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            width: 290px;
            max-width: calc(100vw - 48px);
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            padding: 14px 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
            transition: transform 0.4s ease, background 0.4s ease;
        }
        .music-player:hover { transform: translateY(-4px); background: rgba(255, 255, 255, 0.36); }
        .play-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .play-btn:hover { transform: scale(1.08); }
        .track-info { flex-grow: 1; overflow: hidden; }
        .track-title { font-size: 14px; font-weight: 700; color: #111; margin: 0 0 2px; }
        .track-artist { font-size: 12px; color: #222; margin: 0 0 8px; }
        .progress-container {
            width: 100%;
            height: 5px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            cursor: pointer;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            transition: width 0.1s linear;
        }
        .time-display {
            font-size: 11px;
            font-weight: 600;
            color: #222;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }
        .volume-control { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .mute-btn { background: none; border: none; padding: 0; font-size: 14px; cursor: pointer; }
        .volume-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff7e5f;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="bg-59"></div>

    <div class="container">
        <div class="top-section">
            <div class="photo-placeholder">Фото</div>
            <h1>Закиньте монету мальчику на лечение</h1>
            <p>Нажмите на кнопку ниже, чтобы перейти на страницу пожертвований.</p>
        </div>

        <div class="middle-section">
            <a href="https://www.donationalerts.com/r/anirumovec" class="donate-btn" onclick="window.location.href='https://www.donationalerts.com/r/anirumovec'; return false;">Закинуть монету</a>
        </div>

        <div class="links">
            <p>Прямая ссылка для пожертвований:<br>
                <a href="https://www.donationalerts.com/r/anirumovec">https://www.donationalerts.com/r/anirumovec</a>
            </p>
            <p>Мой Telegram:<br>
                <a href="https://t.me">https://t.me</a>
            </p>
        </div>
    </div>

    <div class="music-player">
        <button class="play-btn" id="playBtn">▶</button>
        <div class="track-info">
            <div class="track-title">8 миля</div>
            <div class="track-artist">madk1d</div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
            <div class="volume-control">
                <button class="mute-btn" id="muteBtn">🔊</button>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
            </div>
        </div>
        <audio id="audioPlayer" src="8milya.mp3" preload="metadata"></audio>
    </div>

    <script src="bg-59.js"></script>
    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const volumeSlider = document.getElementById('volumeSlider');
        const muteBtn = document.getElementById('muteBtn');

        audio.volume = 0.8;

        function fmt(s) {
            if (isNaN(s)) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return m + ':' + (sec < 10 ? '0' : '') + sec;
        }

        playBtn.onclick = () => {
            if (audio.paused) { audio.play(); playBtn.textContent = '❚❚'; }
            else { audio.pause(); playBtn.textContent = '▶'; }
        };

        audio.onloadedmetadata = () => durationEl.textContent = fmt(audio.duration);
        audio.ontimeupdate = () => {
            progressBar.style.width = (audio.currentTime / audio.duration) * 100 + '%';
            currentTimeEl.textContent = fmt(audio.currentTime);
        };
        audio.onended = () => { playBtn.textContent = '▶'; progressBar.style.width = '0%'; };

        progressContainer.onclick = (e) => {
            if (!isNaN(audio.duration)) {
                audio.currentTime = (e.offsetX / progressContainer.clientWidth) * audio.duration;
            }
        };

        volumeSlider.oninput = (e) => {
            audio.volume = e.target.value;
